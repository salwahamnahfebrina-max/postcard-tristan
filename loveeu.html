<html lang="en">
<head>
<meta charset="UTF-8">

<title>for you ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@400;500&display=swap');
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#eee8e2;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;color:#665c56;overflow:hidden}
body:before{content:"";position:fixed;width:500px;height:500px;background:#f5efeb;border-radius:50%;top:-250px;left:-180px;opacity:.65}
body:after{content:"";position:fixed;width:400px;height:400px;background:#e6dcd5;border-radius:50%;bottom:-220px;right:-150px;opacity:.5}
.postcard{width:370px;height:250px;position:relative;perspective:1500px;cursor:pointer;z-index:2}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.22,.61,.36,1)}
.postcard.open .card{transform:rotateY(-180deg)}
.front,.inside{position:absolute;width:100%;height:100%;border-radius:5px;backface-visibility:hidden;background:#faf8f5;box-shadow:0 20px 50px rgba(70,55,45,.13)}
.front{border:1px solid #e4ddd7;display:flex;flex-direction:column;align-items:center;justify-content:center}
.date{position:absolute;top:18px;left:20px;font-size:9px;letter-spacing:2px;color:#aaa09a}
.stamp{position:absolute;top:16px;right:18px;width:30px;height:36px;border:1px solid #d8ccc5;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:14px;color:#b99c91}
.front h1{font-family:'Playfair Display',serif;font-weight:400;font-size:28px;color:#5e514a;margin:0}
.front .line{width:35px;height:1px;background:#cdbdb5;margin:15px 0}
.front .subtitle{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#9b8d86}
.open-text{position:absolute;bottom:17px;font-size:9px;letter-spacing:1.5px;color:#b4a8a2}
.inside{transform:rotateY(180deg);border:1px solid #e4ddd7;padding:18px 28px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;overflow:hidden}
.inside .top{font-size:7px;letter-spacing:2.5px;text-transform:uppercase;color:#b19d94;margin-bottom:5px}
.inside h2{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:27px;color:#604f48;margin:0 0 5px}
.inside p{margin:0;max-width:245px;font-size:9px;line-height:1.5;font-weight:300;color:#80736d}
.photo{width:108px;height:72px;object-fit:cover;border-radius:3px;margin-top:7px;box-shadow:0 5px 15px rgba(70,55,45,.15);opacity:0;transform:translateY(8px) scale(.96);transition:all 1s ease;transition-delay:.7s}
.postcard.open .photo{opacity:1;transform:translateY(0) scale(1)}
.signature{margin-top:6px;font-family:'Playfair Display',serif;font-style:italic;font-size:10px;color:#9b8178;opacity:0;transform:translateY(5px);transition:all 1s ease;transition-delay:1s}
.postcard.open .signature{opacity:1;transform:translateY(0)}
.heart{position:absolute;right:20px;bottom:18px;font-size:17px;color:#b99086;animation:heartbeat 2s ease-in-out infinite}
@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.decor{position:fixed;pointer-events:none;z-index:10;opacity:0;bottom:2%}
.postcard.open~.decor{animation:floatUp 5s ease-out forwards}
.decor:nth-of-type(1){left:12%;font-size:17px;animation-delay:.3s}
.decor:nth-of-type(2){left:25%;font-size:13px;animation-delay:1s}
.decor:nth-of-type(3){right:18%;font-size:18px;animation-delay:.7s}
.decor:nth-of-type(4){right:30%;font-size:12px;animation-delay:1.5s}
.decor:nth-of-type(5){left:45%;font-size:15px;animation-delay:1.8s}
.decor:nth-of-type(6){right:8%;font-size:14px;animation-delay:2.2s}
@keyframes floatUp{0%{opacity:0;transform:translateY(30px) scale(.7) rotate(0)}15%{opacity:.8}50%{opacity:.7;transform:translateY(-45vh) scale(1) rotate(15deg)}100%{opacity:0;transform:translateY(-90vh) scale(.8) rotate(-15deg)}}
@media(max-width:500px){
.postcard{width:320px;height:215px}.front h1{font-size:24px}.inside{padding:16px 24px}.inside h2{font-size:24px}.inside p{font-size:8.5px}.photo{width:92px;height:61px}.signature{font-size:9.5px}
}
</style>
</head>
